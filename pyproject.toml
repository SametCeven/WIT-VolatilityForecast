[project]
name = "volforecast"
version = "0.1.0"
description = "BIST volatility forecasting: naive, VIX and GARCH baselines vs. linear regression and XGBoost."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arch>=7.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=5.24",
    "scikit-learn>=1.5",
    "streamlit>=1.40",
    "xgboost>=2.1",
    "yfinance>=0.2.50",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volforecast"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", # pycodestyle
    "F",      # pyflakes
    "I",      # isort
    "B",      # bugbear
    "UP",     # pyupgrade
    "SIM",    # simplify
    "NPY",    # numpy-specific
]
ignore = ["E501"] # formatter handles line length

[tool.ruff.format]
docstring-code-format = true
